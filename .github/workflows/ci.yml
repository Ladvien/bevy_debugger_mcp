name: CI - Integration Tests and Documentation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/cache
          ~/.cargo/registry
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config xvfb
        
    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS' 
      run: |
        echo "macOS dependencies ready"
        
    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        echo "Windows dependencies ready"
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    # The ratchet replaces plain `-D warnings` for now. `main` was already red when the
    # improvement loop began: the `observability` feature does not compile, and clippy reports
    # hundreds of warnings. The ratchet freezes that debt and fails only when something NEW
    # breaks, so a red build means a real regression. When every `known_red` count reaches
    # zero, delete the ratchet and restore `cargo clippy --workspace --all-targets --all-features
    # -- -D warnings` here.
    - name: Run clippy ratchet
      run: ./scripts/ratchet.sh

    - name: Build
      run: cargo build --verbose --all-features
      continue-on-error: true # `observability` does not compile at the ratchet baseline
    
    - name: Run unit tests
      run: cargo test --lib --verbose

    # `comprehensive_integration_test` does not exist in this tree, so that step could only ever
    # fail. The integration tests that do exist are named `*_integration_test.rs`.
    - name: Run all integration tests
      run: |
        cargo test --test '*integration*' --verbose

  performance:
    name: Performance Regression Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/cache
          ~/.cargo/registry
          target/
        key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev
    
    - name: Build with optimizations
      run: cargo build --release --all-features
      continue-on-error: true # `observability` does not compile at the ratchet baseline

    # The performance and concurrency tests these steps named lived in
    # `tests/comprehensive_integration_test.rs`, which does not exist in this tree. They were
    # removed rather than left to fail every run. Restore them as real tests when there is
    # something to assert.

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-tarpaulin
      uses: actions-rs/install@v0.1
      with:
        crate: cargo-tarpaulin
        version: latest
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/cache
          ~/.cargo/registry
          target/
        key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev
    
    - name: Generate code coverage
      run: |
        cargo tarpaulin --verbose --all-features --workspace --timeout 120 --out xml
    
    - name: Upload to codecov.io
      uses: codecov/codecov-action@v3
      with:
        fail_ci_if_error: false

  documentation:
    name: Documentation Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/cache
          ~/.cargo/registry
          target/
        key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev
    
    - name: Build documentation
      run: |
        cargo doc --all-features --no-deps --document-private-items
    
    - name: Check for broken doc links
      run: |
        cargo rustdoc --all-features -- -D rustdoc::broken_intra_doc_links
    
    - name: Verify book documentation exists
      run: |
        test -f book/USAGE_GUIDE.md
        test -f book/SCREENSHOT_SETUP.md
        test -f book/MACOS_SERVICE.md
        echo "✓ All required documentation files present"
        
    - name: Upload documentation
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: target/doc/

  acceptance:
    name: Acceptance Criteria Validation
    runs-on: ubuntu-latest
    needs: [test, performance, coverage]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/cache
          ~/.cargo/registry
          target/
        key: ${{ runner.os }}-cargo-acceptance-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev
    
    # This job used to run five named tests out of `tests/comprehensive_integration_test.rs` and
    # then write a report that hard-coded a green result. That file does not exist in this tree
    # and the named tests were never in it, so the job could only ever fail, and its report
    # asserted a result nobody measured. The ratchet and the test suite are now the gate. Put
    # real acceptance tests here when there are real ones to run.
    - name: Run the workspace test suite
      run: cargo test --workspace --no-fail-fast

    - name: Generate test report
      run: |
        {
          echo "# Test Report"
          echo ""
          echo "Generated by CI from the actual test run above."
          echo ""
          echo "- Workspace tests: see the step log for the per-binary results."
        } > test_report.md
    
    - name: Upload test report
      uses: actions/upload-artifact@v3
      with:
        name: test-report
        path: test_report.md