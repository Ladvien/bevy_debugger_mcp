[package]
name = "bevy_debugger_bevy"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Companion Bevy plugin for bevy_debugger_mcp — registers custom BRP methods for screenshot, inspection, and headless input injection"
license = "MIT OR Apache-2.0"
publish = false
keywords = ["bevy", "debugging", "mcp", "brp", "gamedev"]
categories = ["game-development", "development-tools"]

[dependencies]
# `serialize` is what makes `KeyCode`/`MouseButton` deserialize by name, which is how
# `bevy_debugger/input` accepts every key Bevy knows instead of a hand-written table that goes
# stale. See `input.rs`.
bevy = { version = "0.19", features = ["default", "bevy_remote", "serialize"] }
bevy_remote = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = []
input = []
screenshot = []