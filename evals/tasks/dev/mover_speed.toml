id = "mover_speed"
prompt = """My Bevy game is running right now and you are connected to it through a debugger. One object in it is moving across the world. Along which axis does it move, and how fast, in world units per second? Measure it in the live game rather than guessing."""
expected_tools = ["brp", "observe"]
max_turns = 25
timeout_s = 240

[[facts]]
name = "moves_along_x"
regex = '\bx[- ]?(axis|direction|coordinate|component|value|position)|\bthe x\b|translation[.\s]*x\b|\+x\b|\balong x\b|\bx (is )?(increas|grow|chang|advanc)'

[[facts]]
name = "speed_about_2"
number_min = 1.8
number_max = 2.2
